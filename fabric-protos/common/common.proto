// HM-CertChain block-header schema excerpt.
// IMPORTANT: This file is NOT a replacement for the full upstream
// fabric-protos/common/common.proto. Do NOT regenerate the entire Fabric
// protocol module from this excerpt: the other original messages are absent.
syntax = "proto3";
package common;
option go_package = "github.com/hyperledger/fabric-protos-go/common";

message BlockHeader {
  uint64 number = 1;
  bytes previous_hash = 2;
  bytes data_hash = 3;
  bytes pre_ca_hash = 4;
}
